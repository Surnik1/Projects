{% extends 'base.html' %}

{% block content %}
<h1>Все мероприятия</h1>
{% for event in events %}
    <div class="event-card">
        <h3>{{ event.name }}</h3>
        <p>{{ event.description|truncatewords:20 }}</p>
        <p>Дата: {{ event.date }}</p>
        <a href="{% url 'event_detail' event.id %}">Подробнее</a>
    </div>
{% endfor %}
{% endblock %}
